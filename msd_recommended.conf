<?xml version="1.0" encoding="utf-8"?>

<!--
 Sizes in kb, time in seconds

 msd.conf - исправленная версия.
 1) threadPool: тег threadsCountMax (а не threadsCount), fBindToCPU=yes.
 2) streamProxy/multicast: ОДИН блок <multicast> + <route> (роутинг /udp//rtp/ по префиксу).
 3) Канал Test111.ts: тип tcp-http + tcp/remonteHostname + http/urlPath.
 4) Убраны несуществующие теги fCacheGetTimeSyscall / timerGranularity / fUsePollingForSend в sourceProfile.
 5) rcvTimeout в multicast-профилях снижен с 5 до 30 сек.
-->

<msd>

<log>
<file>/var/log/msd.log</file>
		<level>7</level>
	</log>

	<HTTP>
		<skt>
			<congestionControl>htcp</congestionControl>
		</skt>
		<bindList>
			<bind><address>31.148.197.2:7088</address></bind>
		</bindList>
		<hostnameList>
			<hostname>*</hostname>
		</hostnameList>
	</HTTP>

<systemResourceLimits>
	<maxOpenFiles>8192</maxOpenFiles>
	<maxCoreFileSize>unlimited</maxCoreFileSize>
	<maxMemLock>unlimited</maxMemLock>
	<processPriority>-10</processPriority>
</systemResourceLimits>

	<limits>
		<precacheMin>0</precacheMin>
		<precacheMax>131072</precacheMax>
		<sndBlockSizeMin>32</sndBlockSizeMin>
		<sndBlockSizeMax>512</sndBlockSizeMax>
	</limits>

<threadPool>
	<threadsCountMax>12</threadsCountMax>
	<fBindToCPU>yes</fBindToCPU>
</threadPool>
<hubProfileList>
		<hubProfile>
			<name>default</name>
			<fUsePollingForSend>yes</fUsePollingForSend>
			<fZeroCopyOnSend>no</fZeroCopyOnSend>
			<MPEG2TS><fEnable>yes</fEnable></MPEG2TS>
			<fZeroCliPersistent>yes</fZeroCliPersistent>
			<zeroCliTimeout>680400</zeroCliTimeout>
			<fZeroSrcBitratePersistent>no</fZeroSrcBitratePersistent>
			<precache>16384</precache>
			<sndBlockSize>256</sndBlockSize>
			<skt>
				<sndBuf>2048</sndBuf>
			</skt>
			<headersList>
				<header>Pragma: no-cache</header>
				<header>Content-Type: video/mpeg</header>
				<header>ContentFeatures.DLNA.ORG: DLNA.ORG_OP=01;DLNA.ORG_CI=0;DLNA.ORG_FLAGS=01700000000000000000000000000000</header>
				<header>TransferMode.DLNA.ORG: Streaming</header>
			</headersList>
			<sourceProfile>
				<MPEG2TS><fEnable>yes</fEnable></MPEG2TS>
				<ringBufSize>32768</ringBufSize>
				<ringBufStorePath>/tmp</ringBufStorePath>
			</sourceProfile>
		</hubProfile>
<hubProfile>
			<name>default123</name>
			<fUsePollingForSend>yes</fUsePollingForSend>
			<fZeroCopyOnSend>no</fZeroCopyOnSend>
			<MPEG2TS><fEnable>yes</fEnable></MPEG2TS>
			<fZeroCliPersistent>no</fZeroCliPersistent>
			<zeroCliTimeout>10</zeroCliTimeout>
			<fZeroSrcBitratePersistent>no</fZeroSrcBitratePersistent>
			<precache>8192</precache>
			<sndBlockSize>64</sndBlockSize>
			<skt>
				<sndBuf>1024</sndBuf>
			</skt>
			<headersList>
				<header>Pragma: no-cache</header>
				<header>Content-Type: video/mpeg</header>
				<header>ContentFeatures.DLNA.ORG: DLNA.ORG_OP=01;DLNA.ORG_CI=0;DLNA.ORG_FLAGS=01700000000000000000000000000000</header>
				<header>TransferMode.DLNA.ORG: Streaming</header>
			</headersList>
			<sourceProfile>
				<MPEG2TS><fEnable>yes</fEnable></MPEG2TS>
				<ringBufSize>16384</ringBufSize>
				<ringBufStorePath>/tmp</ringBufStorePath>
			</sourceProfile>
		</hubProfile>
	</hubProfileList>
<sourceProfileList>
		<sourceProfile>
			<name>multicast-udp-default</name>
			<MPEG2TS><fEnable>yes</fEnable></MPEG2TS>
			<ringBufSize>32768</ringBufSize>
			<skt>
				<rcvBuf>16384</rcvBuf>
				<rcvLowat>128</rcvLowat>
				<rcvTimeout>30</rcvTimeout>
				<fReusePort>yes</fReusePort>
			</skt>
			<multicast>
				<ifName>lo</ifName>
			</multicast>
		</sourceProfile>

		<sourceProfile>
			<name>multicast-udp-dummy0</name>
			<MPEG2TS><fEnable>yes</fEnable></MPEG2TS>
			<ringBufSize>32768</ringBufSize>
			<skt>
				<rcvBuf>16384</rcvBuf>
				<rcvLowat>128</rcvLowat>
				<rcvTimeout>30</rcvTimeout>
				<fReusePort>yes</fReusePort>
			</skt>
			<multicast>
				<ifName>dummy0</ifName>
			</multicast>
		</sourceProfile>
<sourceProfile>
			<name>multicast-udp-dummy1</name>
			<MPEG2TS><fEnable>yes</fEnable></MPEG2TS>
			<ringBufSize>32768</ringBufSize>
			<skt>
				<rcvBuf>16384</rcvBuf>
				<rcvLowat>128</rcvLowat>
				<rcvTimeout>30</rcvTimeout>
				<fReusePort>yes</fReusePort>
			</skt>
			<multicast>
				<ifName>dummy1</ifName>
			</multicast>
		</sourceProfile>

		<sourceProfile>
			<name>multicast-udp-dummy2</name>
			<MPEG2TS><fEnable>yes</fEnable></MPEG2TS>
			<ringBufSize>32768</ringBufSize>
			<skt>
				<rcvBuf>16384</rcvBuf>
				<rcvLowat>128</rcvLowat>
				<rcvTimeout>30</rcvTimeout>
				<fReusePort>yes</fReusePort>
			</skt>
			<multicast>
				<ifName>dummy2</ifName>
			</multicast>
		</sourceProfile>

		<sourceProfile>
			<name>tcp-http-default</name>
			<MPEG2TS><fEnable>yes</fEnable></MPEG2TS>
			<ringBufSize>32768</ringBufSize>
			<errorRateInterval>0</errorRateInterval>
			<errorRateMax>20</errorRateMax>
			<skt>
				<rcvBuf>2048</rcvBuf>
				<rcvLowat>48</rcvLowat>
				<rcvTimeout>30</rcvTimeout>
			</skt>
			<tcp>
				<remonteHostname>SomeServer.tv:7088</remonteHostname>
				<connectTimeout>50</connectTimeout>
				<reconnectInterval>5</reconnectInterval>
				<reconnectCount>50</reconnectCount>
				<fSocketHalfClosed>no</fSocketHalfClosed>
			</tcp>
			<http>
				<headersList>
					<header>Accept: */*</header>
					<header>User-Agent: NSPlayer/7.10.0.3059</header>
					<header>getcontentFeatures.dlna.org: 1</header>
				</headersList>
			</http>
		</sourceProfile>
	</sourceProfileList>
<streamProxy>
		<multicast>
			<fEnable>yes</fEnable>
			<hubProfileName>default</hubProfileName>
			<sourceProfileName>multicast-udp-dummy0</sourceProfileName>

			<route>
				<dstPrefix>239.0.0.0</dstPrefix>
				<dstMask>255.255.255.0</dstMask>
				<sourceProfileName>multicast-udp-dummy0</sourceProfileName>
			</route>
			<route>
				<dstPrefix>239.0.1.0</dstPrefix>
				<dstMask>255.255.255.0</dstMask>
				<sourceProfileName>multicast-udp-dummy1</sourceProfileName>
			</route>
			<route>
				<dstPrefix>239.50.50.0</dstPrefix>
				<dstMask>255.255.255.0</dstMask>
				<sourceProfileName>multicast-udp-dummy2</sourceProfileName>
			</route>
		</multicast>

		<http>
			<fEnable>yes</fEnable>
			<hubProfileName>default</hubProfileName>
			<sourceProfileName>tcp-http-default</sourceProfileName>
		</http>
		<transparent>
			<fEnable>yes</fEnable>
			<hubProfileName>default</hubProfileName>
			<sourceProfileName>tcp-http-default</sourceProfileName>
		</transparent>
	</streamProxy>

	<channelList>
		<includeFile>/etc/iptv.conf</includeFile>
		<!--
		<channel>
			<name>Test111.ts</name>
			<hubProfileName>default</hubProfileName>
			<precache>8192</precache>
			<skt><sndBuf>1024</sndBuf></skt>
			<sourceList>
				<source>
					<type>tcp-http</type>
					<sourceProfileName>tcp-http-default</sourceProfileName>
					<tcp><remonteHostname>31.148.197.2:6878</remonteHostname></tcp>
					<http><urlPath>ace/getstream?id=50c13be1307994322057222dbbeefd22622e333d</urlPath></http>
				</source>
			</sourceList>
		</channel>
		-->
	</channelList>

</msd>