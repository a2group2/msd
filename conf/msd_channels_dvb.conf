<?xml version="1.0" encoding="utf-8"?>
<!-- DVB channel examples. Linux + DVB adapter /dev/dvb required. -->
<!-- Full config reference: see README.md, section "DVB (digital TV tuner) support". -->

<channel>
	<name>dvb-t2.ts</name>
	<hubProfileName>default</hubProfileName>
	<sourceList>
		<source>
			<type>dvb</type>
			<dvb>
				<adapter>0</adapter>
				<frontend>0</frontend>
				<demux>0</demux>
				<dmxBufSize>2048</dmxBufSize>
				<deliverySystem>DVBT2</deliverySystem>
				<frequency>578000000</frequency>
				<bandwidth>8MHZ</bandwidth>
				<pnr>1</pnr>
			</dvb>
		</source>
	</sourceList>
</channel>

<channel>
	<name>dvb-s2.ts</name>
	<hubProfileName>default</hubProfileName>
	<sourceList>
		<source>
			<type>dvb</type>
			<dvb>
				<adapter>0</adapter>
				<frontend>0</frontend>
				<demux>1</demux>
				<deliverySystem>DVBS2</deliverySystem>
				<frequency>1997000000</frequency>
				<symbolRate>27500000</symbolRate>
				<modulation>8PSK</modulation>
				<rolloff>0.35</rolloff>
				<fec>3_4</fec>
			</dvb>
		</source>
	</sourceList>
</channel>